<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>往期周刊 · 数据库开源生态观测</title>
<link rel="stylesheet" href="assets/app.css">
<style>
/* 期刊行：期号 + 主题标签 + 深读三篇 */
.iss { border: 1px solid var(--line); border-radius: 12px; background: var(--card);
       padding: 14px 18px; margin-bottom: 12px; box-shadow: var(--shadow); }
.iss-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.iss-no { font-weight: 700; color: var(--accent); }
.iss-head .tags { display: inline-flex; gap: 6px; flex-wrap: wrap; }
.iss-deep { display: grid; gap: 5px; margin-top: 9px; }
.iss-deep .it { display: flex; gap: 9px; align-items: baseline; font-size: 12px; min-width: 0; }
.iss-deep .it .t { color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.iss-deep .it .fn { color: var(--muted); }
</style>
</head>
<body>
<div id="nav"></div>
<div class="wrap">
  <section class="hero" style="padding:30px 0 6px">
    <h1>往期周刊</h1>
    <p>全部往期按期号倒序。深读按「类别轮值 + 板块主打 + 本周事件」三席选出；数字与速览冻结于发刊快照，往期所见即当时所记。</p>
  </section>
  <main>
    <section class="card">
      <div class="card-head"><h2>全部期刊<span class="hint" id="cnt"></span></h2></div>
      <div id="list"></div>
    </section>
  </main>
  <footer id="foot"></footer>
</div>

<script src="data/weekly.js"></script>
<script src="assets/app.js?v=20261021"></script>
<script>
"use strict";
const WK = window.WEEKLY || {};
const NOS = Object.keys(WK).map(Number).sort((a, b) => b - a);
el("cnt").textContent = NOS.length ? `${NOS.length} 期` : "暂无";
el("list").innerHTML = NOS.length ? NOS.map(no => {
  const R = WK[no], th = R.theme || {};
  const chips = [
    th.cat ? `<span class="tag gray">类别轮值 · ${esc(th.cat)}</span>` : "",
    th.side ? `<span class="tag gray">${th.side === "cn" ? "国产主打" : "国际主打"}</span>` : "",
    (R.deep || []).some(d => d.sec === "ai") ? `<span class="tag">AI×数据库</span>` : ""
  ].filter(Boolean).join("");
  return `<article class="iss">
    <div class="iss-head">
      <span class="iss-no">第 ${R.no} 期</span>
      <span class="small muted">${esc(R.date)} · 快照 ${esc(R.snap || "—")}</span>
      <span class="tags">${chips}</span>
      <a class="more-btn" style="margin-left:auto" href="index.html#issue=${R.no}">阅读本期 →</a>
    </div>
    <div class="iss-deep">${R.deep.map(d =>
      `<div class="it"><span class="sector">${esc(d.tag)}</span>
        <span class="t">${esc(d.title)}</span>
        <span class="fn mono">${esc(d.fn)}</span></div>`).join("")}</div>
  </article>`;
}).join("") : `<div class="empty"><div class="big">📭</div>还没有期刊 —— 运行 python build/freeze_issue.py --freeze 1 生成第一期。</div>`;
document.body.insertAdjacentHTML("afterbegin", navHtml("archive.html"));
el("foot").innerHTML = `往期周刊 · 共 ${NOS.length} 期 · 内容与数据冻结于各期快照 · <a href="index.html">回到最新期 →</a>`;
bindThemeBtn();
</script>
</body>
</html>
