/* 明暗模式：先于渲染读取偏好，避免闪白（auto 跟随系统，手动选择存 localStorage） */
(function () {
  try {
    var t = localStorage.getItem('theme');
    if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  } catch (e) { /* 隐私模式下忽略 */ }
})();
</script>
