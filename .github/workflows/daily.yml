name: AI×DB 周报采集

# 每天多个时间点自动采集（北京时间），冗余触发避免 GitHub schedule 被跳过：
#   - 北京 08:00 (UTC 00:00)  早晨首采
#   - 北京 14:00 (UTC 06:00)  午间补采
#   - 北京 20:00 (UTC 12:00)  晚间兜底
# 注意：同一天多次运行，快照/草稿会被覆盖（同名文件），发布日(周一)有去重保护，
#       不会重复发期或污染往期目录。
on:
  schedule:
    - cron: '0 0 * * *'    # 北京 08:00
    - cron: '0 6 * * *'    # 北京 14:00
    - cron: '0 12 * * *'   # 北京 20:00
  workflow_dispatch: {}    # 允许手动触发

# 关键：默认 GITHUB_TOKEN 是 read-only，必须显式给写权限才能 push 回仓库
permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取代码（含完整历史，便于提交回主分支）
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 安装 Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3. 运行采集脚本
      - name: Run collector
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python db_trending.py

      # 4. 提交快照和成品到仓库（持久化数据，支撑下周增量对比）
      - name: Commit results
        run: |
          git config user.name "ai-db-weekly-bot"
          git config user.email "bot@ai-db-weekly.local"
          git add cache/ output/ || true
          # 没有变更就跳过提交（避免空 commit 失败）
          if git diff --staged --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "auto: $(date -u +%Y-%m-%d) 采集"
          # rebase 远端最新（防止手动改了仓库后定时任务 push 冲突）
          git pull --rebase origin ${{ github.ref_name }} || true
          git push
