name: AI×DB 周报采集

# 每天 UTC 00:00 自动运行（北京时间 08:00）
# 也可手动触发
on:
  schedule:
    - cron: '0 0 * * *'  # UTC 00:00 = 北京时间 08:00
  workflow_dispatch: {}   # 允许手动触发

# 关键：默认 GITHUB_TOKEN 是 read-only，必须显式给写权限才能 push 回仓库
permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取代码（含完整历史，便于提交回主分支）
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 安装 Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3. 运行采集脚本
      - name: Run collector
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python db_trending.py

      # 4. 提交快照和成品到仓库（持久化数据，支撑下周增量对比）
      - name: Commit results
        run: |
          git config user.name "ai-db-weekly-bot"
          git config user.email "bot@ai-db-weekly.local"
          git add cache/ output/ || true
          # 没有变更就跳过提交（避免空 commit 失败）
          if git diff --staged --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "auto: $(date -u +%Y-%m-%d) 采集"
          # rebase 远端最新（防止手动改了仓库后定时任务 push 冲突）
          git pull --rebase origin ${{ github.ref_name }} || true
          git push
