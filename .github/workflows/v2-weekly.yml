name: v2 周报生成

# 每周一跑 v2 版周报（run_weekly.py），生成三板块周报（report.md），提交到 v2/reports/。
#   - 北京 周一 12:00 (UTC 04:00)，当日 09:00 的采集已跑完并写入缓存。
# 依赖 actions/cache 里的历史快照做 7 天 diff（storage.find_prev_snapshot_date 自动定位）。
# 若当日 daily 被跳过，可直接 workflow_dispatch 手动重跑本流程。
"on":
  schedule:
    - cron: '0 4 * * 1'    # UTC 04:00 = 北京 周一 12:00
  workflow_dispatch: {}    # 允许手动触发

# 需 push 周报 Markdown，必须显式给写权限
permissions:
  contents: write

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # 1. 拉取代码（fetch-depth:0 拉完整历史，rebase/提交回主分支需要）
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 安装 Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3. 安装依赖（v2 仅依赖 requests）
      - name: 安装依赖
        working-directory: v2
        run: pip install -r requirements.txt

      # 4. 恢复历史快照缓存（含当日 daily 产物 + 近一周历史，供 7 天 diff）
      - name: 恢复 data 缓存
        uses: actions/cache@v4
        with:
          path: v2/data
          key: v2-data-${{ github.run_id }}
          restore-keys: |
            v2-data-

      # 5. 生成周报（自动定位 7 天前快照；v2 脚本在子目录，必须 working-directory: v2）
      - name: 生成周报
        working-directory: v2
        timeout-minutes: 60
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
        run: python run_weekly.py

      # 6. 把渲染出的 Markdown 暂存到可提交的 v2/reports/（data/ 被 gitignore）
      - name: 暂存周报到 v2/reports/
        working-directory: v2
        run: |
          mkdir -p reports
          SNAP=$(ls -1d data/snapshot_* | sort | tail -1)
          echo "最新快照目录：$SNAP"
          if [ -f "$SNAP/weekly/report.md" ]; then
            cp "$SNAP/weekly/report.md" "reports/report_$(basename "$SNAP").md"
          fi
          ls -la reports/ || true

      # 7. 更新 README 首页（v2 接管；原 v1 update_readme() 已退役）
      #    重写 LATEST 区块为本期 v2 周报链接，并把 v2 各期追加进「往期周报」表
      - name: 更新 README 首页
        run: |
          python3 - <<'EOF'
          import re
          from pathlib import Path

          import datetime

          BASE = datetime.date(2026, 8, 5)  # 与 v2/config.py FIRST_ISSUE_DATE 保持一致

          reports = sorted(Path("v2/reports").glob("report_snapshot_*.md"))
          assert reports, "v2/reports/ 下没有周报文件"

          def issue_no(p):
              m = re.search(r"第\s*(\d+)\s*期", p.read_text(encoding="utf-8"))
              if m:
                  return m.group(1)
              # 早期周报标题是「第 N 期」占位符：按日期推算（与 run_weekly._issue_no 同式）
              d = p.stem.removeprefix("report_snapshot_")
              dt = datetime.date(int(d[:4]), int(d[4:6]), int(d[6:]))
              return str(max(0, (dt - BASE).days // 7 + 1))

          def snap_date(p):
              d = p.stem.removeprefix("report_snapshot_")
              return f"{d[:4]}-{d[4:6]}-{d[6:]}"

          latest = reports[-1]
          latest_block = (
              "<!-- LATEST:START -->\n"
              "<!-- 本区块由 v2-weekly.yml 自动维护（v1 update_readme 已退役），请勿手动编辑 -->\n"
              f"> 📖 **本期周报**：[第 {issue_no(latest)} 期 · {snap_date(latest)}]({latest.as_posix()})\n"
              "> 📚 **历史周报**：见文末[「往期周报」](#往期周报)\n"
              "<!-- LATEST:END -->"
          )

          rows = [
              f"| 第 {issue_no(p)} 期 | {snap_date(p)} | [{p.name}]({p.as_posix()}) |"
              for p in reversed(reports)
          ]
          archive_block = (
              "<!-- ARCHIVE:START -->\n"
              "| 期数 | 日期 | 链接 |\n"
              "|------|------|------|\n"
              + "\n".join(rows) + "\n"
              "<!-- ARCHIVE:END -->"
          )

          readme = Path("README.md")
          t = readme.read_text(encoding="utf-8")

          def replace_between(text, start_marker, end_marker, block):
              pre, rest = text.split(start_marker, 1)
              _, post = rest.split(end_marker, 1)
              return pre + block + post

          t = replace_between(t, "<!-- LATEST:START -->", "<!-- LATEST:END -->", latest_block)
          t = replace_between(t, "<!-- ARCHIVE:START -->", "<!-- ARCHIVE:END -->", archive_block)
          readme.write_text(t, encoding="utf-8")
          print(f"README 已更新：本期 = 第 {issue_no(latest)} 期 · {snap_date(latest)}")
          EOF

      # 8. 提交周报到仓库（v2/reports/ 未被 gitignore，可在 GitHub 直接浏览）
      - name: 提交周报
        run: |
          git config user.name "ai-db-weekly-bot"
          git config user.email "bot@ai-db-weekly.local"
          git add v2/reports/ README.md || true
          # 没有变更就跳过提交（避免空 commit 失败）
          if git diff --staged --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "weekly: $(date -u +%Y-%m-%d) v2 周报"
          # 丢弃缓存恢复覆盖旧快照产生的未暂存漂移（同 v2-daily.yml，否则 rebase 失败）
          git restore .
          # rebase + theirs：冲突时一律用本地（本次生成）版本，周报是权威产出
          git pull --rebase --strategy-option=theirs origin ${{ github.ref_name }}
          git push
